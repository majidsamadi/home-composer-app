name: Verify Composer application

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Node application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # No lockfile and no dependencies: setup-node without cache: npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check B-RFX v0.3 draft contract fixtures
        run: node scripts/check-contract-fixtures.mjs
      - name: Check v0.4 draft contract fixtures
        run: node scripts/check-contract-fixtures-v0_4.mjs
      - name: Run node --test suite
        run: npm test
